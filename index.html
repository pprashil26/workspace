<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace</title>
<style>
:root{
  --bg:#EEF3EA;
  --ui:#DCE5D6;
  --accent:#E8D998;
  --white:#FFFFFF;
  --text:#2F3A2F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
}
header{
  background:var(--ui);
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
main{
  flex:1;
  display:flex;
  overflow:hidden;
}
.sidebar{
  width:220px;
  background:var(--ui);
  padding:12px;
}
.sidebar button{
  width:100%;
  margin-bottom:6px;
}
.content{
  flex:1;
  padding:16px;
  overflow:auto;
}
.card{
  background:var(--white);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}
input,textarea,button{
  font:inherit;
}
input,textarea{
  width:100%;
  padding:8px;
}
.filters{
  display:flex;
  gap:8px;
  margin:12px 0;
}
.notes-view{display:none}
.note-layout{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:12px;
}
</style>
</head>
<body>

<header>
  <strong>Workspace</strong>
  <div>
    <button>Export</button>
    <button>Import</button>
  </div>
</header>

<main>

  <aside class="sidebar">
    <button id="tasksBtn">Tasks</button>
    <button id="notesBtn">Notes</button>

    <hr><br>

    <button>Inbox</button>
    <button>This Week</button>
    <button>Later</button>
    <button>Someday</button>
  </aside>

  <section class="content">

    <div id="tasksView">

      <div class="card">
        <input placeholder="Add task...">
      </div>

      <div class="filters">
        <button>All</button>
        <button>Next Actions</button>
        <button>Scheduled</button>
        <button>No Date</button>
      </div>

      <div class="card">
        <input type="checkbox"> Review audit evidence
        <button>⭐</button>
      </div>

    </div>

    <div id="notesView" class="notes-view">

      <div class="note-layout">

        <div class="card">
          <button>+ Note</button>
          <br><br>
          <div>Project Notes</div>
          <div>Meeting Notes</div>
        </div>

        <div class="card">
          <input placeholder="Note title">
          <br><br>
          <textarea rows="18" placeholder="Supports [[Linked Notes]]"></textarea>
          <br><br>
          <strong>Backlinks</strong>
        </div>

      </div>

    </div>

  </section>

</main>

<script>
const tasksBtn=document.getElementById('tasksBtn');
const notesBtn=document.getElementById('notesBtn');
const tasksView=document.getElementById('tasksView');
const notesView=document.getElementById('notesView');

tasksBtn.onclick=()=>{
 tasksView.style.display='block';
 notesView.style.display='none';
};

notesBtn.onclick=()=>{
 tasksView.style.display='none';
 notesView.style.display='block';
};
</script>

</body>
</html>
